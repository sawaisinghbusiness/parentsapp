<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Home tiles preview</title>
<style>
body{margin:0;background:#e9eaec;font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:#242628}
.phone{max-width:400px;margin:24px auto;background:#fff;padding:24px 20px;border-radius:20px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.home-tile{height:68px;box-sizing:border-box;border:1px solid;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;overflow:hidden;padding:6px 2px 0;text-decoration:none;color:inherit}
.home-tile span{font-size:11.5px;font-weight:700;line-height:1.15}
.home-tile img{display:block;max-width:100%;object-fit:contain;object-position:bottom}
button{margin-top:16px;padding:8px 14px;border-radius:8px;border:1px solid #ccc;background:#fff}
/* Home quick tiles: a soft blue card that fades in, then each picture glides in its own way and settles on the card's bottom edge.
   One long ease-out per picture, no overshoot, so each comes to rest smoothly. */
.home-tile{border-color:#E1E7F8;background:linear-gradient(160deg,#F4F7FF 0%,#DCE5FF 100%);animation:home-tile-in .35s ease-out both}
.home-tile img{animation-fill-mode:both;animation-timing-function:cubic-bezier(.16,1,.3,1);will-change:transform}
.home-art-bus{animation-name:home-art-bus;animation-duration:1.3s}
.home-art-rise{animation-name:home-art-rise;animation-duration:1s}
.home-art-tilt{transform-origin:50% 100%;animation-name:home-art-tilt;animation-duration:1.1s}
.home-art-cheer{transform-origin:50% 100%;animation-name:home-art-cheer;animation-duration:1.1s}
@keyframes home-tile-in{from{opacity:0}to{opacity:1}}
/* The bus drives in from the left and slows to a gentle stop. */
@keyframes home-art-bus{from{transform:translateX(-160%)}to{transform:none}}
/* The boy and his desk rise up out of the card's bottom edge. */
@keyframes home-art-rise{from{transform:translateY(105%)}to{transform:none}}
/* The hand rises while turning upright, as if offering the coin. */
@keyframes home-art-tilt{from{transform:translateY(105%) rotate(-14deg)}to{transform:none}}
/* The girl rises while growing to full size, trophy held up. */
@keyframes home-art-cheer{from{transform:translateY(60%) scale(.7);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.home-tile,.home-tile img{animation:none}}
</style></head><body><div class="phone"><div class="grid" id="g">
<a class="home-tile" style="animation-delay:0ms"><span>Transport</span><img class="home-art-bus" style="height:32px;animation-delay:150ms" src="/img/tiles/bus.png"></a>
<a class="home-tile" style="animation-delay:80ms"><span>Homework</span><img class="home-art-rise" style="height:42px;animation-delay:230ms" src="/img/tiles/homework.png"></a>
<a class="home-tile" style="animation-delay:160ms"><span>Fees</span><img class="home-art-tilt" style="height:42px;animation-delay:310ms" src="/img/tiles/fees.png"></a>
<a class="home-tile" style="animation-delay:240ms"><span>Results</span><img class="home-art-cheer" style="height:42px;animation-delay:390ms" src="/img/tiles/results.png"></a>
</div><button onclick="var g=document.getElementById('g');g.outerHTML=g.outerHTML">Animation dobara chalao</button></div></body></html>
